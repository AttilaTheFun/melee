<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melee WebKit smoke test</title>
<style>body{margin:0;background:#080d18;color:white;font:14px system-ui}canvas{width:100vw;height:65vh}pre{white-space:pre-wrap;padding:10px}</style>
<canvas id="canvas"></canvas><pre id="status">Starting…</pre>
<script type="module">
import {Renderer} from './renderer.js';
const status=document.querySelector('#status');
const report={userAgent:navigator.userAgent,secure:isSecureContext,webgpu:!!navigator.gpu,steps:[]};
function publish(){status.textContent=JSON.stringify(report,null,2);window.webkit?.messageHandlers?.report.postMessage(report);}
try {
 let r;try{r=await Renderer.create(document.querySelector('canvas'),error=>{report.error=error.message;publish();});}catch(error){report.gpuUnavailable=error.message;publish();}
 const worker=new Worker('./worker.js',{type:'module'});let id=0;
 function request(type,extra={}){return new Promise((resolve,reject)=>{worker.onmessage=({data})=>data.type==='error'?reject(Error(data.message)):resolve(data);worker.onerror=e=>reject(Error(e.message));worker.postMessage({type,id:++id,...extra});});}
 // Generated locally for tests only. Never included in browser distribution.
 const file=new File([await(await fetch('./fixture.iso')).blob()],'fixture.iso');
 for(const fighter of [0,1,2,0]) {
  r?.device.pushErrorScope('validation');
  const start=performance.now(),data=await request('load',{fighter,...(fighter===0&&id===0?{file}:{})});
  if(r){await r.load(data.parts);r.draw();}
  for(const frame of [0,15,30,60]) {const result=await request('step',{frame});if(r){r.update(result.parts);r.draw();}}
  if(r){await r.device.queue.onSubmittedWorkDone();const error=await r.device.popErrorScope();if(error)throw Error(error.message);}
  report.steps.push({fighter,parts:data.parts.length,duration:data.duration,ms:Math.round(performance.now()-start)});publish();
 }
 worker.terminate();report.workerPassed=true;report.gpuPassed=!!r;publish();
}catch(error){report.error=String(error.message)+'\n'+String(error.stack||'');publish();}
</script>
